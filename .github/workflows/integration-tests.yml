name: Integration Tests

on:
  push:
    branches: [main]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            mtools \
            gdisk \
            gcc \
            g++ \
            make

      - name: Build Limine tools
        run: make limine/limine

      - name: Build kernel
        run: make build/kernel

      - name: Run integration tests
        run: |
          make integration-test 2>&1 | tee integration-output.log
          # Check for any failures in output
          if grep -q "^FAIL:" integration-output.log; then
            echo "Integration tests failed"
            exit 1
          fi

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-logs
          path: integration-output.log

  # Also run unit tests to ensure nothing is broken
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libgtest-dev cmake
          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib/

      - name: Run unit tests
        run: make unit-test
