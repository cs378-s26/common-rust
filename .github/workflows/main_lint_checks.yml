name: Main Lint Checks
on:
    push:
        branches:
            - main
jobs:
    checks:
        name: Run Lint Checks
        runs-on: self-hosted
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Run cargo fmt
              shell: nix develop --command bash -e {0}
              run: cargo fmt --all -- --check
            - name: Run cargo clippy (x86_64)
              shell: nix develop --command bash -e {0}
              run: cargo clippy --target x86_64-unknown-none -Zbuild-std=core,alloc -Zpanic-abort-tests -- -D warnings
            - name: Run cargo clippy (aarch64)
              shell: nix develop --command bash -e {0}
              run: cargo clippy --target aarch64-unknown-none -Zbuild-std=core,alloc -Zpanic-abort-tests -- -D warnings
            - name: Run cargo clippy (x86_64) (tests)
              shell: nix develop --command bash -e {0}
              run: cargo clippy --tests --target x86_64-unknown-none -Zbuild-std=core,alloc -Zpanic-abort-tests -- -D warnings
            - name: Run cargo clippy (aarch64) (tests)
              shell: nix develop --command bash -e {0}
              run: cargo clippy --tests --target aarch64-unknown-none -Zbuild-std=core,alloc -Zpanic-abort-tests -- -D warnings
